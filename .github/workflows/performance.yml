name: Performance Testing

on:
  schedule:
    - cron: '0 3 * * *'  # Run daily at 3 AM
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  api-performance:
    name: API Performance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write  # For PR comments
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust pytest-benchmark pytest-asyncio httpx
    
    - name: Create test data directories
      run: |
        mkdir -p data/benchmarks
        mkdir -p tests/performance
        mkdir -p logs/performance
    
    - name: Run API benchmark tests
      run: |
        pytest tests/performance/test_api_benchmarks.py -v --benchmark-only --benchmark-json=logs/performance/benchmark_results.json || true
      timeout-minutes: 10
      continue-on-error: true
    
    - name: Start API server for load testing
      run: |
        python api_server.py &
        sleep 10
        curl -f http://localhost:8000/health || echo "API health check failed"
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      timeout-minutes: 2
      continue-on-error: true
    
    - name: Run load tests with Locust
      run: |
        locust -f tests/performance/locustfile.py --headless -u 10 -r 2 -t 2m --host http://localhost:8000 --html logs/performance/locust_report.html --csv logs/performance/locust || true
      timeout-minutes: 5
      continue-on-error: true
    
    - name: Generate performance report
      run: |
        python tests/performance/generate_report.py || echo "Report generation skipped"
      continue-on-error: true
    
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-performance-results
        path: |
          logs/performance/
        retention-days: 30
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      continue-on-error: true
      with:
        script: |
          const fs = require('fs');
          let comment = '## 🚀 Performance Test Results\n\n';
          
          // Check if benchmark results exist
          try {
            const benchmarkData = JSON.parse(fs.readFileSync('logs/performance/benchmark_results.json', 'utf8'));
            comment += '### API Benchmarks\n';
            comment += '| Test | Mean | StdDev | Min | Max |\n';
            comment += '|------|------|--------|-----|-----|\n';
            
            benchmarkData.benchmarks.forEach(bench => {
              comment += `| ${bench.name} | ${bench.stats.mean.toFixed(3)}s | ${bench.stats.stddev.toFixed(3)}s | ${bench.stats.min.toFixed(3)}s | ${bench.stats.max.toFixed(3)}s |\n`;
            });
          } catch (e) {
            comment += '_Benchmark data not available_\n\n';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
  
  benchmark-report:
    name: Generate Benchmark Report
    runs-on: ubuntu-latest
    needs: api-performance
    if: always()
    permissions:
      contents: read
      actions: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download performance results
      uses: actions/download-artifact@v4
      with:
        name: api-performance-results
        path: logs/performance/
      continue-on-error: true
    
    - name: Create summary
      run: |
        echo "# Performance Testing Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Execution" >> $GITHUB_STEP_SUMMARY
        echo "- **Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results" >> $GITHUB_STEP_SUMMARY
        echo "Performance test artifacts have been uploaded. Check the artifacts section for detailed results." >> $GITHUB_STEP_SUMMARY
